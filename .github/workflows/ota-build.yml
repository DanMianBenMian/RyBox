name: ota-build
on:
  workflow_dispatch:
  push:
    branches: [main]
# Every Contents API push is its own commit, so a multi-file update queues one
# run per file. Cancel the superseded ones: only the newest commit matters and
# the macOS runner pool is the scarce resource here.
concurrency:
  group: ota-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # macos-14: macOS runner pools jam — macos-latest stalled 25+ min on
    # 2026-10-23 and macos-15 started failing instantly (runner_id=0, no
    # capacity) on 2026-10-24. Xcode 15/16 on macos-14 still covers iOS 17.
    # on 2026-10-23. Our target is iOS 17 / Swift 5.9 — Xcode 16 covers it.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Downgrade project format for the installed Xcode
        # brew's xcodegen is always the newest release and writes objectVersion
        # 77 (Xcode 16+), while this image ships Xcode 15.4 — which refuses the
        # project with "future Xcode project file format (77)". Rewrite the two
        # version keys to the Xcode 14/15 dialect instead of pinning an old
        # xcodegen (whose archives are not fetchable from here).
        run: |
          set -eo pipefail
          PBX=RyBox.xcodeproj/project.pbxproj
          sed -i '' 's/objectVersion = .*;/objectVersion = 56;/' "$PBX"
          # Current xcodegen emits no compatibilityVersion at all, so only the
          # objectVersion rewrite is asserted (and it must not be fatal).
          grep -m1 "objectVersion" "$PBX" || echo "warning: no objectVersion key"

      - name: Build (unsigned)
        run: |
          set -eo pipefail
          xcodebuild -project RyBox.xcodeproj \
            -scheme RyBox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate built app
        id: locate
        run: |
          set -eo pipefail
          APP=$(find "$PWD/build" -name "RyBox.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "ERROR: RyBox.app not found"; exit 1; fi
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"
          echo "found: $APP"

      - name: Fetch + build jbroot (best-effort)
        # The virtual root ships as a standard Procursus bootstrap embedded in the
        # IPA (Preinstalled/ProcursusBootstrap.zip) so RyBox unzips it on first
        # launch — no firmware import. Built HERE from the public Procursus mirror
        # to keep the git repo small (a committed bootstrap would bloat every
        # clone). Best-effort: any failure only warns; Sileo still installs, its
        # dpkg/apt tools just stay unavailable.
        run: |
          set -eo pipefail
          OUT="preinstalled/ProcursusBootstrap.zip"
          if [ -f "$OUT" ]; then echo "jbroot present, skipping fetch"; exit 0; fi
          brew install zstd || echo "warn: zstd install failed"
          URL="${JBROOT_URL:-https://apt.procurs.us/bootstraps/1800/bootstrap-iphoneos-arm64.tar.zst}"
          echo "fetching bootstrap: $URL"
          curl -fsSL -o /tmp/bootstrap.tar.zst "$URL" || { echo "jbroot download failed — skipping"; exit 0; }
          python3 tools/make_jbroot.py --tarzst /tmp/bootstrap.tar.zst --out "$OUT" || echo "jbroot build failed — skipping"
          ls -la "$OUT" 2>/dev/null || echo "no jbroot zip produced"

      - name: Stage preinstalled apps
        run: |
          set -eo pipefail
          APP="${{ steps.locate.outputs.app_path }}"
          # Preinstalled assets ride inside the app bundle. Must be staged BEFORE
          # codesign, or the added files invalidate the seal.
          mkdir -p "$APP/Preinstalled"
          cp preinstalled/Sileo.ipa "$APP/Preinstalled/Sileo.ipa"
          # The minimal jbroot (dpkg/apt + /usr /var) is OPTIONAL and large, so
          # only stage it when present — a missing file must NOT fail the build.
          if [ -f preinstalled/ProcursusBootstrap.zip ]; then
            cp preinstalled/ProcursusBootstrap.zip "$APP/Preinstalled/ProcursusBootstrap.zip"
            echo "staged ProcursusBootstrap.zip"
          else
            echo "ProcursusBootstrap.zip not found — skipping (Sileo still installs)"
          fi
          echo "staged preinstalled:"
          ls -la "$APP/Preinstalled"

      - name: Build RyFsRedirect child dylib (best-effort)
        run: |
          set -eo pipefail
          APP="${{ steps.locate.outputs.app_path }}"
          SYSROOT=$(xcrun --show-sdk-path -sdk iphoneos)
          # A drop-in redirect dylib for guest subprocesses (dpkg/apt): it loads
          # via DYLD_INSERT_LIBRARIES (injected by the parent's posix_spawn hook)
          # and redirects the child's file ops into the jbroot too. Best-effort:
          # if clang fails for any reason the app still builds, child redirect is
          # just absent.
          clang -dynamiclib -arch arm64 \
            -isysroot "$SYSROOT" \
            -I ContainerApp/Sources/Core/GuestLoader \
            -framework Foundation -framework Security \
            ContainerApp/Sources/Core/Filesystem/RyFsRedirect.m \
            ContainerApp/Sources/Core/GuestLoader/litehook.c \
            -o "$APP/RyFsRedirect.dylib" || \
            echo "RyFsRedirect.dylib build skipped (clang step failed)"
          ls -la "$APP/RyFsRedirect.dylib" 2>/dev/null || echo "no dylib (child redirect disabled)"

      - name: Ad-hoc sign + package IPA
        run: |
          set -eo pipefail
          APP="${{ steps.locate.outputs.app_path }}"
          ENT="ContainerApp/ContainerApp.entitlements"
          codesign --force --deep --sign - --entitlements "$ENT" "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP" Payload/RyBox.app
          zip -r RyBox.ipa Payload
          ls -la RyBox.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyBox.ipa
          path: RyBox.ipa
