name: ota-build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    # macos-15 (Xcode 16): macos-latest's runner pool was congested for 25+ min
    # on 2026-10-23. Our target is iOS 17 / Swift 5.9 — Xcode 16 covers it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -eo pipefail
          xcodebuild -project RyBox.xcodeproj \
            -scheme RyBox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate built app
        id: locate
        run: |
          set -eo pipefail
          APP=$(find "$PWD/build" -name "RyBox.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "ERROR: RyBox.app not found"; exit 1; fi
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"
          echo "found: $APP"

      - name: Stage preinstalled apps
        run: |
          set -eo pipefail
          APP="${{ steps.locate.outputs.app_path }}"
          # Preinstalled IPAs (real Sileo) ride inside the app bundle. Must be
          # staged BEFORE codesign, or the added files invalidate the seal.
          mkdir -p "$APP/Preinstalled"
          cp preinstalled/Sileo.ipa "$APP/Preinstalled/Sileo.ipa"
          echo "staged preinstalled:"
          ls -la "$APP/Preinstalled"

      - name: Ad-hoc sign + package IPA
        run: |
          set -eo pipefail
          APP="${{ steps.locate.outputs.app_path }}"
          ENT="ContainerApp/ContainerApp.entitlements"
          codesign --force --deep --sign - --entitlements "$ENT" "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP" Payload/RyBox.app
          zip -r RyBox.ipa Payload
          ls -la RyBox.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyBox.ipa
          path: RyBox.ipa
